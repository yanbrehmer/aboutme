<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Yan Brehmer (yanbrehmer) - Desenvolvedor Backend, Estudante de Ciência da Computação e Gamer.">
    <meta name="theme-color" content="#0f0e17">
    <title>About Me - Yan Brehmer</title>

    <style>
        /* ==========================================================
           RESET & DESIGN TOKENS
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6c63ff;
            --primary-light: #8a84ff;
            --secondary: #ff6584;
            --accent-neon: #3dff91;
            --bg-dark: #0f0e17;
            --bg-card: #181724;
            --text: #f0f0f0;
            --text-secondary: #a7a6b8;
            --border: #2e2c45;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(108, 99, 255, 0.25);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 15%, #191630 0%, #0d0c14 65%, #08070c 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Canvas de Partículas Cyberpunk */
        #cyberpunkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* SVGs Nativos & Ícones */
        .icon {
            display: inline-block;
            width: 1.25em;
            height: 1.25em;
            vertical-align: -0.2em;
            fill: currentColor;
            flex-shrink: 0;
        }

        .icon-lg {
            width: 2.5rem;
            height: 2.5rem;
        }

        /* Seletor de Idioma Flutuante */
        .lang-switch-wrapper {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
        }

        .lang-btn {
            background: rgba(24, 23, 36, 0.88);
            backdrop-filter: blur(10px);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            box-shadow: var(--shadow);
            transition: all 0.25s ease;
        }

        .lang-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Header e Avatar */
        header {
            text-align: center;
            padding: 60px 0 35px;
            position: relative;
        }

        .avatar-container {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            width: 140px;
            height: 140px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: var(--shadow), 0 0 25px rgba(108, 99, 255, 0.35);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            background: #2e2c45;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(108, 99, 255, 0.5);
        }

        /* Discord Badge de Status */
        .discord-status-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #2e2c45;
            border: 3px solid var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #23a55a;
            box-shadow: 0 0 8px #23a55a;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.online {
            background: #23a55a;
            box-shadow: 0 0 10px #23a55a;
        }

        .status-dot.idle {
            background: #f0b232;
            box-shadow: 0 0 10px #f0b232;
        }

        .status-dot.dnd {
            background: #f23f43;
            box-shadow: 0 0 10px #f23f43;
        }

        .status-dot.offline {
            background: #80848e;
            box-shadow: none;
        }

        .discord-activity-card {
            margin-top: 14px;
            background: rgba(24, 23, 36, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 9px;
            box-shadow: var(--shadow);
            max-width: 92%;
            min-height: 38px;
        }

        .discord-activity-card strong {
            color: var(--text);
        }

        .toggle-avatar {
            margin-top: 14px;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            min-height: 36px;
        }

        .toggle-avatar:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
        }

        h1 {
            font-size: clamp(2.1rem, 5vw, 3.2rem);
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-secondary);
            margin-bottom: 22px;
        }

        /* Citação Pessoal Neon */
        .personal-quote {
            max-width: 780px;
            margin: 15px auto 35px;
            padding: 20px 26px;
            border-left: 4px solid var(--accent-neon);
            background: rgba(61, 255, 145, 0.04);
            color: #e5e5e5;
            font-style: italic;
            font-size: clamp(0.95rem, 2vw, 1.08rem);
            line-height: 1.7;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(61, 255, 145, 0.12);
            text-align: center;
        }

        .personal-quote:hover {
            box-shadow: 0 0 25px rgba(61, 255, 145, 0.22);
            transform: translateY(-2px);
        }

        .quote-symbol {
            color: var(--accent-neon);
            font-size: 1.35rem;
            font-weight: bold;
            margin: 0 4px;
        }

        /* Seção Título Padrão */
        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: clamp(1.6rem, 3.5vw, 2.1rem);
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        /* Árvore de Links */
        .links-section {
            padding: 25px 0 45px;
            text-align: center;
        }

        .links-tree {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 10px;
        }

        .link-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 22px 20px;
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .link-item:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(108, 99, 255, 0.25);
        }

        .link-icon-wrap {
            font-size: 2.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-title {
            font-size: 1.22rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .link-description {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.88rem;
            flex-grow: 1;
            line-height: 1.5;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            min-height: 40px;
            transition: all 0.25s ease;
            border: 2px solid var(--primary);
        }

        .link-button:hover {
            background: transparent;
            color: var(--primary-light);
            border-color: var(--primary-light);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
        }

        /* Biografia / Sobre Mim */
        .bio-section {
            padding: 45px 30px;
            background: var(--bg-card);
            border-radius: 20px;
            margin: 45px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .bio-content {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 32px;
        }

        .bio-text {
            flex: 1.2;
            min-width: 290px;
            font-size: 1.02rem;
            line-height: 1.8;
            color: var(--text);
        }

        .bio-text p {
            margin-bottom: 16px;
        }

        .bio-highlights {
            flex: 1;
            min-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .highlight-item {
            background: var(--bg-dark);
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .highlight-item:hover {
            transform: translateX(6px);
            border-color: var(--primary);
        }

        .highlight-title {
            font-size: 1.05rem;
            color: var(--primary-light);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .highlight-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        /* Tech Stack / Habilidades */
        .tech-section {
            background: var(--bg-card);
            border-radius: 20px;
            margin: 45px 0;
            padding: 45px 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .tech-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 20px 14px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tech-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--card-color, var(--primary));
            opacity: 0.7;
        }

        .tech-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-color, var(--primary));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 18px var(--card-glow, rgba(108, 99, 255, 0.3));
        }

        .tech-icon-wrap {
            color: var(--card-color, var(--primary));
            margin-bottom: 4px;
        }

        .tech-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .tech-tag {
            font-size: 0.76rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* PC Setup Section */
        .pc-section {
            background: var(--bg-card);
            border-radius: 20px;
            margin: 45px 0;
            padding: 45px 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .pc-build {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .pc-item {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .pc-item strong {
            color: var(--primary-light);
        }

        .pc-item:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 0 14px rgba(108, 99, 255, 0.25);
        }

        /* Contact Section */
        .contact-section {
            background: var(--bg-card);
            border-radius: 20px;
            margin: 45px 0;
            padding: 45px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .contact-form {
            max-width: 580px;
            margin: 20px auto 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .form-group label {
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.98rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(108, 99, 255, 0.35);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 30px;
            font-size: 1.02rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 46px;
            transition: all 0.25s ease;
            margin-top: 8px;
            border: 2px solid var(--primary);
        }

        .submit-btn:hover {
            background: transparent;
            color: var(--primary-light);
            border-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.4);
        }

        /* Donation Section */
        .donation-section {
            background: var(--bg-card);
            border-radius: 20px;
            margin: 45px 0;
            padding: 45px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .donation-description {
            color: var(--text-secondary);
            margin-bottom: 30px;
            max-width: 580px;
            margin-left: auto;
            margin-right: auto;
            font-size: 0.95rem;
        }

        .donation-wallets {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .wallet {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 18px 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 540px;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .wallet:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .wallet-title {
            font-size: 1.18rem;
            color: var(--secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .wallet-address-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 14, 23, 0.85);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            gap: 10px;
        }

        .wallet-address {
            font-family: Consolas, 'Courier New', monospace;
            color: var(--text);
            word-break: break-all;
            font-size: 0.9rem;
            text-align: left;
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.86rem;
            min-height: 36px;
            transition: all 0.25s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--primary-light);
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.4);
        }

        /* Footer */
        footer {
            background: var(--bg-card);
            padding: 35px 0;
            text-align: center;
            margin-top: 55px;
            border-top: 1px solid var(--border);
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-logo {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            margin: 8px 0;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            transition: color 0.25s ease;
        }

        .footer-link:hover {
            color: var(--primary-light);
        }

        .copyright {
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        /* Animações e Transições */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pulse {
            animation: pulse 1.5s infinite;
        }

        /* Suporte Sem JavaScript (<noscript>) */
        noscript {
            display: block;
            margin-bottom: 20px;
        }

        /* Responsividade Extrema (Mobile 320px a 4K) */
        @media (max-width: 768px) {
            header {
                padding: 45px 0 25px;
            }

            .bio-content {
                flex-direction: column;
                gap: 20px;
            }

            .highlight-item:hover {
                transform: translateY(-3px);
            }

            .lang-switch-wrapper {
                top: 12px;
                right: 12px;
            }

            .bio-section,
            .tech-section,
            .pc-section,
            .contact-section,
            .donation-section {
                padding: 35px 20px;
                margin: 35px 0;
            }
        }

        @media (max-width: 480px) {
            .avatar-wrapper {
                width: 115px;
                height: 115px;
            }

            .links-tree {
                grid-template-columns: 1fr;
            }

            .tech-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .pc-build {
                grid-template-columns: 1fr;
            }

            .wallet-address-container {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .wallet-address {
                text-align: center;
            }

            .copy-btn {
                width: 100%;
            }

            .footer-links {
                flex-direction: column;
                gap: 10px;
            }

            .personal-quote {
                padding: 16px 18px;
            }
        }
    </style>

    <!-- Resiliência No-JS: Garante que nada fique oculto se JS estiver desligado -->
    <noscript>
        <style>
            #cyberpunkCanvas,
            .lang-switch-wrapper,
            .toggle-avatar {
                display: none !important;
            }

            .discord-activity-card {
                display: none !important;
            }
        </style>
    </noscript>
