            display: flex;
            gap: 20px;
            margin: 8px 0;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            transition: color 0.25s ease;
        }

        .footer-link:hover {
            color: var(--primary-light);
        }

        .copyright {
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        /* Animações e Transições */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

            animation: pulse 1.5s infinite;
        }

        /* Suporte Sem JavaScript (<noscript>) */
        noscript {
            display: block;
            margin-bottom: 20px;
        }

        /* Responsividade Extrema (Mobile 320px a 4K) */
        @media (max-width: 768px) {
            header {
                padding: 45px 0 25px;
            }

            .bio-content {
                flex-direction: column;
                gap: 20px;
            }

            .highlight-item:hover {

            }

            .lang-switch-wrapper {
                top: 12px;
                right: 12px;
            }

            .bio-section,
            .tech-section,
            .pc-section,
            .contact-section,
            .donation-section {
                padding: 35px 20px;
                margin: 35px 0;
            }
        }

        @media (max-width: 480px) {
            .avatar-wrapper {
                width: 115px;
                height: 115px;
            }

            .links-tree {
                grid-template-columns: 1fr;
            }

            .tech-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .pc-build {
                grid-template-columns: 1fr;
            }

            .wallet-address-container {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .wallet-address {
                text-align: center;
            }

            .copy-btn {
                width: 100%;
            }

            .footer-links {
                flex-direction: column;
                gap: 10px;
            }

            .personal-quote {
                padding: 16px 18px;
            }
        }
    </style>
